name: Automated Daily Market Ingestion (4:00 PM, 8:00 PM, 11:30 PM IST)

on:
  schedule:
    # 10:30 UTC = 04:00 PM IST (UTC + 5:30)
    - cron: '30 10 * * *'
    # 14:30 UTC = 08:00 PM IST (UTC + 5:30)
    - cron: '30 14 * * *'
    # 18:00 UTC = 11:30 PM IST (UTC + 5:30)
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Snapshot Slot (4pm, 8pm, 11.30pm, manual)'
        required: true
        default: 'manual'
        type: choice
        options:
          - manual
          - 4pm
          - 8pm
          - 11.30pm

jobs:
  run-ingestion:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Ingestion Slot
        id: slot_info
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            SELECTED_SLOT="${{ github.event.inputs.slot }}"
          else
            UTC_HOUR=$(date -u +%H)
            if [ "$UTC_HOUR" -eq 10 ] || [ "$UTC_HOUR" -eq 11 ]; then
              SELECTED_SLOT="4pm"
            elif [ "$UTC_HOUR" -eq 14 ] || [ "$UTC_HOUR" -eq 15 ]; then
              SELECTED_SLOT="8pm"
            elif [ "$UTC_HOUR" -eq 18 ] || [ "$UTC_HOUR" -eq 19 ]; then
              SELECTED_SLOT="11.30pm"
            else
              SELECTED_SLOT="manual"
            fi
          fi
          echo "slot=$SELECTED_SLOT" >> $GITHUB_OUTPUT
          echo "Resolved ingestion slot: $SELECTED_SLOT"

      - name: Check if Remote Cloud Service is Configured
        id: check_remote
        run: |
          if [ -n "${{ secrets.APP_HOST_URL }}" ]; then
            echo "mode=remote" >> $GITHUB_OUTPUT
          else
            echo "mode=local" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Remote Hosted Endpoint (if APP_HOST_URL configured)
        if: steps.check_remote.outputs.mode == 'remote'
        run: |
          SLOT="${{ steps.slot_info.outputs.slot }}"
          echo "Pinging hosted app at ${{ secrets.APP_HOST_URL }} for slot [$SLOT]..."
          curl -s -f -X POST "${{ secrets.APP_HOST_URL }}/api/trigger-collection?slot=${SLOT}" || exit 1
          echo "Successfully triggered ingestion on hosted server."

      - name: Set up Python (Fallback / Standalone Cloud Runner)
        if: steps.check_remote.outputs.mode == 'local'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        if: steps.check_remote.outputs.mode == 'local'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Collection
        if: steps.check_remote.outputs.mode == 'local'
        env:
          AIRBNB_API_KEY: ${{ secrets.AIRBNB_API_KEY }}
          FETCH_INDIVIDUAL_CALENDARS: "false"
        run: |
          SLOT="${{ steps.slot_info.outputs.slot }}"
          python main.py run-collection --slot "$SLOT"

      - name: Commit Updated Database to GitHub
        if: steps.check_remote.outputs.mode == 'local'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/airbnbanalyzer.db config/areas.json
          git diff --staged --quiet || (git commit -m "chore(data): automated daily market snapshot $(date +'%Y-%m-%d') [slot: ${{ steps.slot_info.outputs.slot }}]" && git push)

name: Automated Daily Market Ingestion (4:00 PM, 8:00 PM, 11:30 PM IST)

on:
  schedule:
    # 10:30 UTC = 04:00 PM IST (UTC + 5:30)
    - cron: '30 10 * * *'
    # 14:30 UTC = 08:00 PM IST (UTC + 5:30)
    - cron: '30 14 * * *'
    # 18:00 UTC = 11:30 PM IST (UTC + 5:30)
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Snapshot Slot (4pm, 8pm, 11.30pm, manual)'
        required: true
        default: 'manual'
        type: choice
        options:
          - manual
          - 4pm
          - 8pm
          - 11.30pm

jobs:
  run-ingestion:
    runs-on: ubuntu-latest

    steps:
      - name: Determine Ingestion Slot
        id: slot_info
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            SELECTED_SLOT="${{ github.event.inputs.slot }}"
          else
            UTC_HOUR=$(date -u +%H)
            if [ "$UTC_HOUR" -eq 10 ] || [ "$UTC_HOUR" -eq 11 ]; then
              SELECTED_SLOT="4pm"
            elif [ "$UTC_HOUR" -eq 14 ] || [ "$UTC_HOUR" -eq 15 ]; then
              SELECTED_SLOT="8pm"
            elif [ "$UTC_HOUR" -eq 18 ] || [ "$UTC_HOUR" -eq 19 ]; then
              SELECTED_SLOT="11.30pm"
            else
              SELECTED_SLOT="manual"
            fi
          fi
          echo "slot=$SELECTED_SLOT" >> $GITHUB_OUTPUT
          echo "Resolved ingestion slot: $SELECTED_SLOT"

      - name: Trigger Hosted Application Ingestion
        run: |
          TARGET_URL="${{ secrets.APP_HOST_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://airbnbanalyzer.onrender.com"
          fi
          SLOT="${{ steps.slot_info.outputs.slot }}"
          echo "Sending automated ingestion trigger to $TARGET_URL for slot [$SLOT]..."
          
          # Intelligent Polling Loop: wait until Render wakes up (HTTP 200)
          echo "Checking service status and waking up cold-start if sleeping..."
          WOKE_UP=false
          for i in {1..30}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 15 "$TARGET_URL/api/health" || true)
            if [ "$CODE" = "200" ]; then
              echo "✅ Service is awake and responding (HTTP 200) after attempt $i."
              WOKE_UP=true
              break
            fi
            echo "Waiting for service cold-start... attempt $i (received HTTP $CODE), retrying in 10s..."
            sleep 10
          done

          if [ "$WOKE_UP" != "true" ]; then
            echo "❌ Service did not respond with 200 within 5 minutes."
            exit 1
          fi

          echo "🚀 Triggering collection pipeline for slot [$SLOT]..."
          HTTP_STATUS=$(curl -s -S -o /tmp/resp.json -w "%{http_code}" --connect-timeout 30 --max-time 600 -X POST "$TARGET_URL/api/trigger-collection?slot=${SLOT}")
          echo "Response code: $HTTP_STATUS"
          cat /tmp/resp.json || true
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Initial attempt returned $HTTP_STATUS. Waiting 15 seconds and retrying once..."
            sleep 15
            HTTP_STATUS=$(curl -s -S -o /tmp/resp.json -w "%{http_code}" --connect-timeout 30 --max-time 600 -X POST "$TARGET_URL/api/trigger-collection?slot=${SLOT}")
            echo "Retry response code: $HTTP_STATUS"
            cat /tmp/resp.json || true
          fi

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Successfully executed $SLOT collection on hosted application."
          else
            echo "Trigger failed with HTTP $HTTP_STATUS."
            exit 1
          fi

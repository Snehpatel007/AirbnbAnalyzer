name: Automated Daily Market Ingestion (1:00 AM IST)

on:
  schedule:
    # 19:30 UTC is exactly 01:00 AM IST (UTC + 5:30)
    - cron: '30 19 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  run-ingestion:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if Remote Cloud Service is Configured
        id: check_remote
        run: |
          if [ -n "${{ secrets.APP_HOST_URL }}" ]; then
            echo "mode=remote" >> $GITHUB_OUTPUT
          else
            echo "mode=local" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Remote Hosted Endpoint (if APP_HOST_URL configured)
        if: steps.check_remote.outputs.mode == 'remote'
        run: |
          echo "Pinging hosted app at ${{ secrets.APP_HOST_URL }} to trigger ingestion..."
          curl -s -f -X POST "${{ secrets.APP_HOST_URL }}/api/trigger-collection" || exit 1
          echo "Successfully triggered ingestion on hosted server."

      - name: Set up Python (Fallback / Standalone Cloud Runner)
        if: steps.check_remote.outputs.mode == 'local'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        if: steps.check_remote.outputs.mode == 'local'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Collection
        if: steps.check_remote.outputs.mode == 'local'
        env:
          AIRBNB_API_KEY: ${{ secrets.AIRBNB_API_KEY }}
          FETCH_INDIVIDUAL_CALENDARS: "false"
        run: |
          python main.py run-collection

      - name: Commit Updated Database to GitHub
        if: steps.check_remote.outputs.mode == 'local'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/airbnbanalyzer.db config/areas.json
          git diff --staged --quiet || (git commit -m "chore(data): automated daily market snapshot $(date +'%Y-%m-%d')" && git push)
